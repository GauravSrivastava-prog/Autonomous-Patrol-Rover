[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-patrol-rover"
version = "2.0.0"
description = "Autonomous AI Vision Patrol Rover with 3D GTA Chase Camera, Glassmorphism Minimap HUD, and Hardware-Accelerated Local Multimodal Vision"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Gaurav Srivastava", email = "Gaurav.122467@stu.upes.ac.in" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.0,<2.0.0",
    "pillow>=10.2.0",
    "websockets>=12.0",
    "torch",
    "torchvision",
    "ultralytics",
    "transformers",
]

[project.optional-dependencies]
ai = [
    "torch>=2.0.0",
    "ultralytics>=8.2.0",
    "transformers>=4.40.0",
    "onnxruntime>=1.17.0"
]

[project.scripts]
patrol-rover = "app:main"

[tool.setuptools]
py-modules = ["app", "core_engine"]
